name: Kyro repository maintenance
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
concurrency:
  group: kyro-maintenance-${{ github.event.issue.number || github.event.pull_request.number || 'report' }}
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted default-branch automation is checked out, even for fork PRs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {run} = require('./.github/scripts/kyro-ops.cjs');
            await run({github, context, core});
