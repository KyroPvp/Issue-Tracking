name: Kyro repository maintenance
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
concurrency:
  group: kyro-maintenance-${{ github.event.issue.number || github.event.pull_request.number || 'report' }}
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted default-branch automation is checked out, even for fork PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {run} = require('./.github/scripts/kyro-ops.cjs');
            await run({github, context, core});
