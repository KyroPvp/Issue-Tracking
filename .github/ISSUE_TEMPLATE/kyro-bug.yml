name: Kyro bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["type:bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin and server versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens, IP addresses, and player personal data.
      render: text
  - type: textarea
    id: dependencies
    attributes:
      label: Related issues or affected plugins
